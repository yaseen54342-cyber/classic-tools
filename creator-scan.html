<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastMoss Creator Scan · Classic Mart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--navy:#111827;--blue:#2563EB;--green:#059669;--orange:#EA580C;--purple:#7C3AED;--teal:#0D9488;--line:#E5E7EB;--muted:#6B7280;--bg:#F3F4F6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#111827;font-size:13px}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top .files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ftab{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;color:#374151;display:flex;gap:6px;align-items:center}
  .ftab b{color:var(--muted);font-weight:500}
  .ftab span{cursor:pointer;color:var(--muted)}
  .ftab span:hover{color:#B91C1C}
  .addfile{padding:4px 10px;border:1px dashed var(--blue);border-radius:6px;color:var(--blue);cursor:pointer;font-size:11px;font-weight:600}
  .addfile input{display:none}
  .clear{margin-left:auto;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11px}
  main{padding:18px 20px}
  .stats{display:flex;align-items:flex-end;gap:36px;margin-bottom:14px;flex-wrap:wrap}
  .stat b{display:block;font-size:34px;font-weight:700;line-height:1;color:var(--navy)}
  .stat small{color:var(--muted);font-size:12px}
  .stat.b b{color:var(--orange)}
  .stat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:10px}
  .filters label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .filters input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  .filters input:focus{outline:2px solid #BFDBFE;border-color:var(--blue)}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px}
  .sorts{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
  .sorts span{padding:5px 9px;border-radius:5px;cursor:pointer;color:#374151}
  .sorts span.on{background:var(--navy);color:#fff}
  .legend{margin-left:auto;display:flex;gap:10px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .dl{background:var(--green);color:#fff;border:0;padding:10px 16px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
  .dl:disabled{opacity:.4;cursor:not-allowed}
  .tbl{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:68vh}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:11.5px;white-space:nowrap;cursor:pointer;z-index:1}
  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:8px 10px;border-bottom:1px solid var(--line)}
  tr:hover td{background:#F9FAFB}
  .cr b{display:block;font-weight:600}
  .cr a{color:var(--muted);text-decoration:none;font-size:11.5px}
  .cr .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .sc{display:flex;align-items:center;gap:8px}
  .sc b{width:34px;text-align:right}
  .stack{display:flex;height:9px;width:110px;border-radius:2px;overflow:hidden;background:var(--line)}
  .stack i{display:block;height:100%}
  .open{color:var(--blue);font-size:11px;text-decoration:underline;cursor:pointer}
  .empty{padding:50px;text-align:center;color:var(--muted)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:6px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  details{margin-bottom:12px}
  summary{cursor:pointer;font-size:12px;color:var(--blue);font-weight:600}
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
  .map label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
  .map select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit}
</style>
</head>
<body>
<div class="top">
  <div class="files" id="files"></div>
  <label class="addfile">+ Excel add karo <input type="file" id="file" multiple accept=".xlsx,.xls,.csv"></label>
  <span class="clear" id="clear">sab hatao</span>
</div>

<main>
  <div class="stats" id="stats"></div>

  <details id="mapBox"><summary>Column mapping</summary><div class="map" id="map"></div></details>

  <div class="filters">
    <div><label>Followers min</label><input type="number" id="fMin" value="5000"></div>
    <div><label>Followers max</label><input type="number" id="fMax" value="80000"></div>
    <div><label>Min videos (28d)</label><input type="number" id="fVid" value="20"></div>
    <div><label>Min units sold (28d)</label><input type="number" id="fUnits" value="1"></div>
    <div><label>Min engagement %</label><input type="number" id="fEng" value="1" step="0.1"></div>
    <div><label>Search</label><input type="text" id="q" placeholder="naam, handle, category"></div>
  </div>

  <div class="bar">
    <label class="chk"><input type="checkbox" id="onlyUS" checked> Sirf US</label>
    <label class="chk"><input type="checkbox" id="kids"> Sirf kids / toys fit (<span id="kidsN">0</span>)</label>
    <div class="sorts">Sort:
      <span class="on" data-s="score">Score</span><span data-s="followers">Followers ↑</span><span data-s="eng">Engagement</span><span data-s="unitsPer1k">Sales rate</span>
    </div>
    <div class="legend"><span><i style="background:var(--teal)"></i>Reply</span><span><i style="background:var(--blue)"></i>Engage</span><span><i style="background:var(--purple)"></i>Reach</span><span><i style="background:var(--orange)"></i>Sales</span></div>
    <button class="dl" id="dl" disabled>Download Excel (0)</button>
  </div>

  <div class="tbl" id="tbl"><div class="empty">Upar "+ Excel add karo" se FastMoss ki export files daalo.</div></div>
</main>
<div class="toast" id="toast"></div>

<script>
const FIELDS={
  name:['nickname','creator name','display','name','creator'],
  handle:['handle','username','user name','unique id','uniqueid','account','tiktok id','creator id','@'],
  followers:['follower','fans'],
  videos:['video count','videos','video num','vids','posts'],
  units:['units sold','sold','sales volume','items sold','pieces','orders'],
  gmv:['gmv','sales amount','revenue','total sales','sales($','sales (','sales'],
  eng:['engagement','interaction rate','er'],
  views:['avg view','average view','views','play'],
  region:['region','country','location'],
  category:['category','niche','industry','tag'],
  link:['url','link','homepage','profile'],
};
const LABEL={name:'Creator name',handle:'Handle',followers:'Followers',videos:'Videos (28d)',units:'Units sold (28d)',gmv:'GMV',eng:'Engagement %',views:'Avg views',region:'Region',category:'Category',link:'Profile link'};
const BCOL=['#0D9488','#EA580C','#7C3AED','#2563EB','#DB2777','#65A30D'];
const BATCH_CUT=[85,75]; // score >=85 → Batch 1, >=75 → Batch 2, else Batch 3

let filesL=[],headers=[],map={},sortKey='score',view=[];
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)};
const num=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).replace(/[$,%\s]/g,'').toLowerCase(),m=1;if(/k$/.test(s)){m=1e3;s=s.slice(0,-1)}else if(/m$/.test(s)){m=1e6;s=s.slice(0,-1)}else if(/w$/.test(s)){m=1e4;s=s.slice(0,-1)}const n=parseFloat(s);return isNaN(n)?0:n*m};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');

function detect(hs){const m={};for(const f in FIELDS){m[f]='';for(const k of FIELDS[f]){const h=hs.find(h=>h.toLowerCase().includes(k)&&!Object.values(m).includes(h));if(h){m[f]=h;break}}}return m}
function renderMap(){$('map').innerHTML=Object.keys(FIELDS).map(f=>`<div><label>${LABEL[f]}</label><select data-f="${f}"><option value="">—</option>${headers.map(h=>`<option ${map[f]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('');$('map').querySelectorAll('select').forEach(s=>s.onchange=()=>{map[s.dataset.f]=s.value;apply()})}

$('file').addEventListener('change',async ev=>{
  for(const f of ev.target.files){
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!rows.length)continue;
    if(!headers.length){headers=Object.keys(rows[0]);map=detect(headers);renderMap();if(!map.handle||!map.followers)$('mapBox').open=true}
    filesL.push({name:f.name,rows});
  }
  ev.target.value='';apply();
});
$('clear').onclick=()=>{filesL=[];headers=[];map={};$('map').innerHTML='';apply()};

function normalize(){
  const seen=new Set(),out=[];
  for(const f of filesL)for(const r of f.rows){
    const g=k=>map[k]?r[map[k]]:'';
    let h=String(g('handle')||'').trim().replace(/^https?:\/\/(www\.)?tiktok\.com\/@?/,'').replace(/^@/,'').split(/[\/?]/)[0];
    if(!h)continue;const key=h.toLowerCase();if(seen.has(key))continue;seen.add(key);
    const followers=num(g('followers')),units=num(g('units')),gmv=num(g('gmv')),eng=num(g('eng')),views=num(g('views')),videos=num(g('videos'));
    out.push({name:String(g('name')||h),handle:h,followers,units,gmv,eng,views,videos,region:String(g('region')||''),category:String(g('category')||''),link:String(g('link')||'')||`https://www.tiktok.com/@${h}`,unitsPer1k:followers?units/followers*1000:0,viewsPerFoll:followers?views/followers:0,kids:/(kid|toy|baby|child|infant|toddler|mom|parent)/i.test(String(g('category'))+' '+String(g('name')))});
  }
  const pct=(k,inv)=>{const s=[...out].sort((a,b)=>a[k]-b[k]);const n=s.length;out.forEach(x=>{let p=n>1?s.indexOf(x)/(n-1)*100:50;x['_'+k]=inv?100-p:p})};
  pct('unitsPer1k');pct('eng');pct('viewsPerFoll');pct('gmv');pct('followers',true);
  out.forEach(x=>{x.reply=x._followers;x.engage=x._eng;x.reach=x._viewsPerFoll;x.sales=(x._unitsPer1k*0.7+x._gmv*0.3);x.score=Math.round((x.sales*0.4+x.engage*0.25+x.reach*0.2+x.reply*0.15)*10)/10;x.batch=x.score>=BATCH_CUT[0]?1:x.score>=BATCH_CUT[1]?2:3});
  return out;
}

function apply(){
  $('files').innerHTML=filesL.map((f,i)=>`<div class="ftab">${esc(f.name)} <b>${f.rows.length}</b><span data-i="${i}">✕</span></div>`).join('');
  $('files').querySelectorAll('span').forEach(s=>s.onclick=()=>{filesL.splice(+s.dataset.i,1);if(!filesL.length){headers=[];map={}}apply()});
  const all=normalize();
  $('kidsN').textContent=all.filter(x=>x.kids).length;
  const fMin=num($('fMin').value),fMax=num($('fMax').value)||Infinity,fVid=num($('fVid').value),fUnits=num($('fUnits').value),fEng=num($('fEng').value),q=$('q').value.trim().toLowerCase();
  const has=k=>!!map[k];
  view=all.filter(x=>x.followers>=fMin&&x.followers<=fMax&&(!has('videos')||x.videos>=fVid)&&(!has('units')||x.units>=fUnits)&&(!has('eng')||x.eng>=fEng)&&(!$('onlyUS').checked||!has('region')||/^(us|usa|united states|america)/i.test(x.region.trim()))&&(!$('kids').checked||x.kids)&&(!q||(x.name+' '+x.handle+' '+x.category).toLowerCase().includes(q)));
  view.sort((a,b)=>sortKey==='followers'?a.followers-b.followers:b[sortKey]-a[sortKey]);
  const bc=[1,2,3].map(b=>view.filter(x=>x.batch===b).length);
  $('stats').innerHTML=`<div class="stat"><b>${fmt(all.length)}</b><small>creators loaded</small></div><div class="stat b"><b>${fmt(view.length)}</b><small>filters pass kiye</small></div>`+bc.map((n,i)=>`<div class="stat"><b style="color:${BCOL[i]}">${n}</b><small><span class="dot" style="background:${BCOL[i]}"></span>Batch ${i+1}</small></div>`).join('');
  $('dl').disabled=!view.length;$('dl').textContent=`Download Excel (${view.length})`;
  renderTable();
}
function renderTable(){
  const w=$('tbl');
  if(!view.length){w.innerHTML=`<div class="empty">${filesL.length?'Koi creator filters pass nahi kar raha — filters loose karo ya Column mapping check karo.':'Upar "+ Excel add karo" se FastMoss ki export files daalo.'}</div>`;return}
  const cols=[['#',''],['Creator','name'],['Followers','followers'],['Eng %','eng'],['Views/Foll','viewsPerFoll'],['Units/1k','unitsPer1k'],['Units 28d','units'],['GMV','gmv'],['Score','score'],['','']];
  let h='<table><thead><tr>'+cols.map(([t,k],i)=>`<th data-k="${k}" class="${i>1&&i<9?'r':''}">${t}</th>`).join('')+'</tr></thead><tbody>';
  view.forEach((x,i)=>{h+=`<tr><td>${i+1}</td><td class="cr"><b><span class="d" style="background:${BCOL[x.batch-1]}"></span>${esc(x.name)}</b><a href="${esc(x.link)}" target="_blank">@${esc(x.handle)}</a></td><td class="r">${fmt(x.followers)}</td><td class="r">${x.eng.toFixed(2)}</td><td class="r">${x.viewsPerFoll.toFixed(2)}</td><td class="r">${x.unitsPer1k.toFixed(1)}</td><td class="r">${fmt(x.units)}</td><td class="r">${x.gmv?'$'+fmt(x.gmv):'—'}</td><td><div class="sc"><b>${x.score}</b><div class="stack"><i style="width:${x.reply*.15}%;background:var(--teal)"></i><i style="width:${x.engage*.25}%;background:var(--blue)"></i><i style="width:${x.reach*.2}%;background:var(--purple)"></i><i style="width:${x.sales*.4}%;background:var(--orange)"></i></div></div></td><td><a class="open" href="${esc(x.link)}" target="_blank">open</a></td></tr>`});
  w.innerHTML=h+'</tbody></table>';
  w.querySelectorAll('th[data-k]').forEach(th=>{if(th.dataset.k)th.onclick=()=>{sortKey=th.dataset.k;syncSort();apply()}});
}
function syncSort(){document.querySelectorAll('.sorts span').forEach(s=>s.classList.toggle('on',s.dataset.s===sortKey))}
document.querySelectorAll('.sorts span').forEach(s=>s.onclick=()=>{sortKey=s.dataset.s;syncSort();apply()});
['fMin','fMax','fVid','fUnits','fEng','q','onlyUS','kids'].forEach(id=>$(id).addEventListener('input',apply));

$('dl').onclick=()=>{
  const row=x=>({Batch:'ABC'[x.batch-1],Creator:x.name,Handle:'@'+x.handle,Link:x.link,Followers:x.followers,'Eng %':+x.eng.toFixed(2),'Views/Foll':+x.viewsPerFoll.toFixed(2),'Units/1k':+x.unitsPer1k.toFixed(1),'Units 28d':x.units,GMV:x.gmv,Videos:x.videos,Region:x.region,Category:x.category,Score:x.score});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(view.map(row)),'All');
  [1,2,3].forEach(b=>{const r=view.filter(x=>x.batch===b);if(r.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.map(row)),'Batch '+'ABC'[b-1])});
  XLSX.writeFile(wb,`Creator_Scan_${new Date().toISOString().slice(0,10)}_${view.length}.xlsx`);
};
apply();
</script>
</body>
</html>
